spring:
  application:
    name: vanilla-dream-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vanilla_dream}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-local-secret-to-a-long-random-string-at-least-32-bytes}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}

logging:
  level:
    org.hibernate.SQL: info
