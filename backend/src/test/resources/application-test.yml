spring:
  datasource:
    url: jdbc:h2:mem:vanilla_dream_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origin: http://localhost:3000
  jwt:
    secret: test-secret-for-vanilla-dream-auth-tests-1234567890
    expiration-minutes: 60

