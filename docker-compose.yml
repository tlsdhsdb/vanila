name: vanilla-dream

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanilla-dream-postgres
    environment:
      POSTGRES_DB: vanilla_dream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vanilla-dream-postgres:/var/lib/postgresql/data

volumes:
  vanilla-dream-postgres:
